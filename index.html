<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--gold:#c9a84c;--green:#2d6a4f;--text:#f0e6d3;--text2:#b8a89a;--card:#1e2747;--r:12px}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
a{color:var(--gold);text-decoration:none}
.ctr{max-width:1200px;margin:0 auto;padding:0 20px}
nav{background:var(--bg2);border-bottom:2px solid var(--gold);padding:12px 0;position:sticky;top:0;z-index:100}
nav .ctr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:1.6rem;font-weight:900;color:var(--gold);cursor:pointer}
.nv{display:flex;gap:6px;flex-wrap:wrap}
.nv button{background:none;border:1px solid transparent;color:var(--text2);padding:8px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.9rem;transition:.3s}
.nv button:hover,.nv button.on{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.1)}
.hero{text-align:center;padding:40px 20px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:var(--r);margin:20px 0}
.hero h1{color:var(--gold);font-size:2.2rem;margin-bottom:8px}
.hero p{color:var(--text2)}
.sbar{display:flex;justify-content:center;gap:40px;padding:20px;background:var(--bg2);border-radius:var(--r);margin:20px 0;flex-wrap:wrap}
.si{text-align:center}.sn{font-size:2rem;font-weight:900;color:var(--gold)}.sl{font-size:.85rem;color:var(--text2)}
.sb{max-width:600px;margin:20px auto}
.sb input{width:100%;padding:14px 20px;border-radius:30px;border:2px solid var(--bg3);background:var(--card);color:var(--text);font-family:inherit;font-size:1rem;outline:none}
.sb input:focus{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:20px 0}
.card{background:var(--card);border-radius:var(--r);padding:24px;border:1px solid rgba(201,168,76,.15);transition:.3s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 8px 30px rgba(201,168,76,.15)}
.av{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--green));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2rem;font-weight:900;color:var(--bg)}
.card h3{text-align:center;color:var(--gold);font-size:1.1rem;margin-bottom:4px}
.card .rg{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:8px}
.card .ct{text-align:center}.tag{display:inline-block;padding:3px 12px;border-radius:12px;font-size:.78rem;background:rgba(45,106,79,.2);color:#5cb88a}
.ph{text-align:center;padding:40px 20px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:var(--r);margin:20px 0}
.ph .av{width:120px;height:120px;font-size:3rem;border:4px solid var(--gold);margin-bottom:20px}
.ph h1{color:var(--gold);font-size:1.8rem;margin-bottom:8px}
.ph .mt{color:var(--text2);font-size:.9rem}
.bio{background:var(--card);padding:24px;border-radius:var(--r);margin:20px 0;line-height:1.8;border-right:4px solid var(--gold)}
.pi{background:var(--card);border-radius:var(--r);margin:12px 0;border:1px solid rgba(201,168,76,.1);overflow:hidden}
.pih{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.3s;flex-wrap:wrap;gap:8px}
.pih:hover{background:rgba(201,168,76,.05)}
.pih h3{color:var(--gold);font-size:1rem}
.bds{display:flex;gap:6px;flex-wrap:wrap}
.bd{padding:3px 10px;border-radius:12px;font-size:.75rem}
.bd-t{background:rgba(45,106,79,.2);color:#5cb88a}
.bd-m{background:rgba(201,168,76,.15);color:var(--gold)}
.bd-r{background:rgba(15,52,96,.5);color:#7eb8da}
.pic{padding:0 20px 20px;white-space:pre-line;line-height:2;color:var(--text2);display:none;border-top:1px solid rgba(201,168,76,.1);padding-top:16px;font-size:1.05rem}
.pic.show{display:block}
.flt{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0;justify-content:center}
.flt select{padding:10px 16px;border-radius:20px;border:1px solid var(--bg3);background:var(--card);color:var(--text);font-family:inherit;font-size:.9rem;outline:none;cursor:pointer}
.flt select:focus{border-color:var(--gold)}
.rc{text-align:center;color:var(--text2);margin:10px 0}
.an{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.an button{padding:10px 20px;border-radius:20px;border:1px solid var(--bg3);background:var(--card);color:var(--text2);cursor:pointer;font-family:inherit;transition:.3s}
.an button:hover,.an button.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
table{width:100%;border-collapse:collapse;margin:16px 0}
th{background:var(--bg3);color:var(--gold);padding:12px;text-align:right;font-size:.85rem}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem}
tr:hover td{background:rgba(201,168,76,.03)}
.btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:.8rem;transition:.3s;margin:0 2px}
.bg{background:var(--gold);color:var(--bg)}.bgr{background:var(--green);color:#fff}.br{background:#c0392b;color:#fff}
.btn:hover{opacity:.85}
.bk{background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:20px;cursor:pointer;font-family:inherit;margin:20px 0;transition:.3s}
.bk:hover{background:var(--gold);color:var(--bg)}
.st{color:var(--gold);font-size:1.3rem;margin:30px 0 15px;padding-bottom:8px;border-bottom:2px solid rgba(201,168,76,.2)}
.pc{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid rgba(201,168,76,.1)}
.pc h3{color:var(--gold);margin-bottom:6px}
.pc .pn{color:var(--green);font-size:.9rem}
.pc .pv{color:var(--text2);font-size:.9rem;margin-top:8px;line-height:1.6;max-height:60px;overflow:hidden}
.pnd{background:var(--card);border-radius:var(--r);padding:20px;margin:12px 0;border-right:4px solid #e67e22}
.pnd h3{color:var(--gold)}.pnd .acts{margin-top:12px;display:flex;gap:8px}
footer{background:var(--bg2);border-top:2px solid var(--gold);padding:30px 20px;margin-top:40px;text-align:center}
footer .logo{font-size:1.3rem;margin-bottom:10px;display:block}
footer p{color:var(--text2);font-size:.85rem;line-height:1.6}
.page{display:none}.page.on{display:block}
@media(max-width:768px){.grid{grid-template-columns:1fr}.sbar{gap:20px}.sn{font-size:1.4rem}nav .ctr{justify-content:center}.flt select{min-width:110px}}</style>

else if(s==='review'){var pnd=D.poems.filter(function(p){return p.s==='pending'});if(pnd.length===0){h='<p style="text-align:center;color:#b8a89a;padding:40px">'+L.noPending+'</p>'}else{pnd.forEach(function(p){var poet=D.poets.find(function(x){return x.id===p.pid});h+='<div class="pnd"><h3>'+p.t+'</h3><div style="color:#b8a89a;margin:4px 0">'+poet.n+' | '+p.ty+' | '+p.m+'</div><div style="white-space:pre-line;color:#b8a89a;margin:8px 0;line-height:1.8">'+p.co.replace(/\n/g,'<br>')+'</div><div class="acts"><button class="btn bgr" onclick="approveP('+p.id+')">'+L.approve+'</button><button class="btn br" onclick="rejectP('+p.id+')">'+L.reject+'</button></div></div>'})}}
else if(s==='stats'){h='<div class="grid">';var regions={};D.poets.forEach(function(p){regions[p.r]=(regions[p.r]||0)+1});h+='<div class="pc"><h3>'+L.byRegion+'</h3>';for(var k in regions)h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)"><span>'+k+'</span><span style="color:#c9a84c;font-weight:700">'+regions[k]+'</span></div>';h+='</div>';var types={};D.poems.filter(function(p){return p.s==='published'}).forEach(function(p){types[p.ty]=(types[p.ty]||0)+1});h+='<div class="pc"><h3>'+L.byType+'</h3>';for(var k in types)h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)"><span>'+k+'</span><span style="color:#c9a84c;font-weight:700">'+types[k]+'</span></div>';h+='</div>';var meters={};D.poems.filter(function(p){return p.s==='published'}).forEach(function(p){meters[p.m]=(meters[p.m]||0)+1});h+='<div class="pc"><h3>'+L.byMeter+'</h3>';for(var k in meters)h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)"><span>'+k+'</span><span style="color:#c9a84c;font-weight:700">'+meters[k]+'</span></div>';h+='</div></div>'}
$('ac').innerHTML=h}
function approveP(id){D.poems.forEach(function(p){if(p.id===id)p.s='published'});showAdmin('review');renderPoets()}
function rejectP(id){D.poems.forEach(function(p){if(p.id===id)p.s='rejected'});showAdmin('review')}
document.addEventListener('DOMContentLoaded',function(){renderPoets();$('hs').addEventListener('input',function(){renderPoets(this.value)});$('sq').addEventListener('input',function(){doSearch()});$('fr').addEventListener('change',doSearch);$('ft').addEventListener('change',doSearch);$('fm').addEventListener('change',doSearch);$('frl').addEventListener('change',doSearch)});

// Admin nav buttons

[{t:L.poetsTab,s:'poets'},{t:L.poemsTab,s:'poems'},{t:L.reviewTab,s:'review'},{t:L.statsTab,s:'stats'}].forEach(function(x,i){
var b=document.createElement('button');b.textContent=x.t;b.onclick=function(){showAdmin(x.s)};if(i===0)b.className='on';an.appendChild(b)});

});
