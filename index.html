<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuaraa AlQatif - لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a2e;
      --bg2: #16213e;
      --bg3: #0f3460;
      --gold: #c9a84c;
      --green: #2d6a4f;
      --text: #f0e6d3;
      --text2: #b8a89a;
      --card: #1e2747;
      --r: 12px;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
    }
    a {
      color: var(--gold);
      text-decoration: none;
    }
    .ctr {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    nav {
      background: var(--bg2);
      border-bottom: 2px solid var(--gold);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .ctr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      cursor: pointer;
    }
    .nv {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nv button {
      background: none;
      border: 1px solid transparent;
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: 0.3s;
    }
    .nv button:hover, .nv button.on {
      color: var(--gold);
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.1);
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border-radius: var(--r);
      margin: 20px 0;
    }
    .hero h1 {
      color: var(--gold);
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .hero p {
      color: var(--text2);
    }
    .sbar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: var(--bg2);
      border-radius: var(--r);
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .si {
      text-align: center;
    }
    .sn {
      font-size: 2rem;
      font-weight: 900;
      color: var(--gold);
    }
    .sl {
      font-size: 0.85rem;
      color: var(--text2);
    }
    .sb {
      max-width: 600px;
      margin: 20px auto;
    }
    .sb input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 30px;
      border: 2px solid var(--bg3);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
    .sb input:focus {
      border-color: var(--gold);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }
    .card {
      background: var(--card);
      border-radius: var(--r);
      padding: 24px;
      border: 1px solid rgba(201, 168, 76, 0.15);
      transition: 0.3s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 8px 30px rgba(201, 168, 76, 0.15);
    }
    .av {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--green));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 2rem;
      font-weight: 900;
      color: var(--bg);
      overflow: hidden;
    }
    .av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card h3 {
      text-align: center;
      color: var(--gold);
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .card .rg {
      text-align: center;
      color: var(--text2);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .card .ct {
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      background: rgba(45, 106, 79, 0.2);
      color: #5cb88a;
    }
    .ph {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border-radius: var(--r);
      margin: 20px 0;
    }
    .ph .av {
      width: 120px;
      height: 120px;
      font-size: 3rem;
      border: 4px solid var(--gold);
      margin-bottom: 20px;
    }
    .ph h1 {
      color: var(--gold);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .ph .mt {
      color: var(--text2);
      font-size: 0.9rem;
    }
    .bio {
      background: var(--card);
      padding: 24px;
      border-radius: var(--r);
      margin: 20px 0;
      line-height: 1.8;
      border-right: 4px solid var(--gold);
    }
    .pi {
      background: var(--card);
      border-radius: var(--r);
      margin: 12px 0;
      border: 1px solid rgba(201, 168, 76, 0.1);
      overflow: hidden;
    }
    .pih {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.3s;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pih:hover {
      background: rgba(201, 168, 76, 0.05);
    }
    .pih h3 {
      color: var(--gold);
      font-size: 1rem;
    }
    .bds {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .bd {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
    }
    .bd-t {
      background: rgba(45, 106, 79, 0.2);
      color: #5cb88a;
    }
    .bd-m {
      background: rgba(201, 168, 76, 0.15);
      color: var(--gold);
    }
    .bd-r {
      background: rgba(15, 52, 96, 0.5);
      color: #7eb8da;
    }
    .pic {
      padding: 0 20px 20px;
      white-space: pre-line;
      line-height: 2;
      color: var(--text2);
      display: none;
      border-top: 1px solid rgba(201, 168, 76, 0.1);
      padding-top: 16px;
      font-size: 1.05rem;
    }
    .pic.show {
      display: block;
    }
    .flt {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
      justify-content: center;
    }
    .flt select {
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--bg3);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .flt select:focus {
      border-color: var(--gold);
    }
    .rc {
      text-align: center;
      color: var(--text2);
      margin: 10px 0;
    }
    .an {
      display: flex;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .an button {
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--bg3);
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      transition: 0.3s;
    }
    .an button:hover, .an button.on {
      background: var(--gold);
      color: var(--bg);
      border-color: var(--gold);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    th {
      background: var(--bg3);
      color: var(--gold);
      padding: 12px;
      text-align: right;
      font-size: 0.85rem;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
    }
    tr:hover td {
      background: rgba(201, 168, 76, 0.03);
    }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: 0.3s;
      margin: 0 2px;
    }
    .bg {
      background: var(--gold);
      color: var(--bg);
    }
    .bgr {
      background: var(--green);
      color: #fff;
    }
    .br {
      background: #c0392b;
      color: #fff;
    }
    .btn:hover {
      opacity: 0.85;
    }
    .bk {
      background: none;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      margin: 20px 0;
      transition: 0.3s;
    }
    .bk:hover {
      background: var(--gold);
      color: var(--bg);
    }
    .st {
      color: var(--gold);
      font-size: 1.3rem;
      margin: 30px 0 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(201, 168, 76, 0.2);
    }
    .pc {
      background: var(--card);
      border-radius: var(--r);
      padding: 20px;
      border: 1px solid rgba(201, 168, 76, 0.1);
    }
    .pc h3 {
      color: var(--gold);
      margin-bottom: 6px;
    }
    .pc .pn {
      color: var(--green);
      font-size: 0.9rem;
    }
    .pc .pv {
      color: var(--text2);
      font-size: 0.9rem;
      margin-top: 8px;
      line-height: 1.6;
      max-height: 60px;
      overflow: hidden;
    }
    .pnd {
      background: var(--card);
      border-radius: var(--r);
      padding: 20px;
      margin: 12px 0;
      border-right: 4px solid #e67e22;
    }
    .pnd h3 {
      color: var(--gold);
    }
    .pnd .acts {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    footer {
      background: var(--bg2);
      border-top: 2px solid var(--gold);
      padding: 30px 20px;
      margin-top: 40px;
      text-align: center;
    }
    footer .logo {
      font-size: 1.3rem;
      margin-bottom: 10px;
      display: block;
    }
    footer p {
      color: var(--text2);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .page {
      display: none;
    }
    .page.on {
      display: block;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .sbar {
        gap: 20px;
      }
      .sn {
        font-size: 1.4rem;
      }
      nav .ctr {
        justify-content: center;
      }
      .flt select {
        min-width: 110px;
      }
    }
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .login-form {
      background: var(--card);
      padding: 30px;
      border-radius: var(--r);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .login-form h3 {
      color: var(--gold);
      margin-bottom: 20px;
    }
    .login-form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid var(--bg3);
      background: var(--bg2);
      color: var(--text);
      outline: none;
    }
    .alert {
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      text-align: center;
    }
    .alert-success {
      background: rgba(45, 106, 79, 0.3);
      color: #5cb88a;
    }
    .alert-error {
      background: rgba(192, 57, 43, 0.3);
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div id="loginModal" class="login-modal" style="display: none;">
    <div class="login-form">
      <h3>تسجيل الدخول</h3>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button class="btn bg" onclick="login()">دخول</button>
      <div id="loginAlert" class="alert" style="display: none;"></div>
    </div>
  </div>

  <nav>
    <div class="ctr">
      <span class="logo" onclick="showPage('p-home')" id="logoText"></span>
      <div class="nv">
        <button class="on" onclick="showPage('p-home')" id="navHome"></button>
        <button onclick="showPage('p-search')" id="navSearch"></button>
        <button onclick="checkLogin('p-admin')" id="navAdmin"></button>
      </div>
    </div>
  </nav>

  <div class="ctr">
    <div id="p-home" class="page on">
      <div class="hero">
        <h1 id="heroTitle"></h1>
        <p id="heroSub"></p>
      </div>
      <div class="sbar">
        <div class="si">
          <div class="sn" id="poetCountDisplay">6</div>
          <div class="sl" id="statPoets"></div>
        </div>
        <div class="si">
          <div class="sn" id="poemCountDisplay">10</div>
          <div class="sl" id="statPoems"></div>
        </div>
        <div class="si">
          <div class="sn" id="regionCountDisplay">3</div>
          <div class="sl" id="statRegions"></div>
        </div>
      </div>
      <div class="sb">
        <input type="text" id="hs" placeholder="">
      </div>
      <h2 class="st" id="secPoets"></h2>
      <div class="grid" id="pg"></div>
    </div>

    <div id="p-poet" class="page">
      <button class="bk" onclick="showPage('p-home')" id="backBtn"></button>
      <div id="pd"></div>
    </div>

    <div id="p-search" class="page">
      <h2 class="st" id="secSearch"></h2>
      <div class="sb">
        <input type="text" id="sq" placeholder="">
      </div>
      <div class="flt">
        <select id="fr"><option value=""></option></select>
        <select id="ft"><option value=""></option></select>
        <select id="fm"><option value=""></option></select>
        <select id="frl"><option value=""></option></select>
      </div>
      <div class="rc" id="src"></div>
      <div class="grid" id="sr"></div>
    </div>

    <div id="p-admin" class="page">
      <h2 class="st" id="secAdmin"></h2>
      <div class="an" id="adminNav"></div>
      <div id="ac"></div>
    </div>
  </div>

  <footer>
    <span class="logo" id="footLogo"></span>
    <p id="footDesc"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // البيانات الافتراضية
    var D = {
      poets: [
        {
          id: 1,
          n: "عبدالله الخباز",
          img: "",
          b: "شاعر من القطيف، يعد من أبرز شعراء المنطقة في الشعر الفصيح والشعبي. له عدة دواوين شعرية.",
          r: "القطيف",
          c: "القطيف",
          co: "السعودية",
          y: 1975,
          pc: 2
        },
        {
          id: 2,
          n: "حسن العبدالله",
          img: "",
          b: "شاعر أحسائي معروف بقصائده في الغزل والحكمة. له حضور بارز في الساحة الأدبية.",
          r: "الأحساء",
          c: "الهفوف",
          co: "السعودية",
          y: 1980,
          pc: 2
        },
        {
          id: 3,
          n: "فاطمة محمد",
          img: "",
          b: "شاعرة بحرينية متميزة في الشعر الفصيح والحر. حاصلة على عدة جوائز أدبية.",
          r: "البحرين",
          c: "المنامة",
          co: "البحرين",
          y: 1985,
          pc: 2
        },
        {
          id: 4,
          n: "علي الجاسم",
          img: "",
          b: "شاعر قطيفي من جيل الشباب، يكتب الشعر الشعبي والفصيح.",
          r: "القطيف",
          c: "سيهات",
          co: "السعودية",
          y: 1990,
          pc: 1
        },
        {
          id: 5,
          n: "محمد الصالح",
          img: "",
          b: "شاعر من القطيف متخصص في الشعر النبطي والشعبي.",
          r: "القطيف",
          c: "تاروت",
          co: "السعودية",
          y: 1982,
          pc: 2
        },
        {
          id: 6,
          n: "زينب الحسين",
          img: "",
          b: "شاعرة أحسائية تكتب في الوجدان والوطن. لها حضور في الملتقيات الشعرية.",
          r: "الأحساء",
          c: "المبرز",
          co: "السعودية",
          y: 1988,
          pc: 1
        }
      ],
      poems: [
        {
          id: 1,
          pid: 1,
          t: "قصيدة الوطن",
          co: "يا وطن الغالي على القلب منزلك
في كل شريان دمي يجري حبك
من شرقك الزاهي إلى غربك وشمالك
أنت الضياء وأنت نبض فؤادي",
          ty: "فصيح",
          m: "الطويل",
          rl: "ك",
          s: "published"
        },
        {
          id: 2,
          pid: 1,
          t: "في حب القطيف",
          co: "قطيف الخير يا أم النخيل
يا عين الماء يا الطين الأصيل
كل حارة فيك تروي ذكرياتنا
وأسوارك الفسيحة تحكي مجدي",
          ty: "شعبي",
          m: "الرمل",
          rl: "ل",
          s: "published"
        },
        {
          id: 3,
          pid: 2,
          t: "غزل أحسائي",
          co: "عيونك يا حلوة سحر ما لها حدود
كأن الله صاغ فيها جمال الوجود
إذا نظرت إلى الدنيا بغيرك ما رأت
شمساً تشرق أو نوراً على الوجود",
          ty: "فصيح",
          m: "البسيط",
          rl: "د",
          s: "published"
        },
        {
          id: 4,
          pid: 2,
          t: "حكمة الزمان",
          co: "يقولون الزمان يعلمني كل يوم
وكل يوم فيك تعلمني يا زمان
ما كل ما يتمنى المرء يدركه
وتجئ اللذاذة مختلطة بالأحزان",
          ty: "شعبي",
          m: "الوافر",
          rl: "ن",
          s: "published"
        },
        {
          id: 5,
          pid: 3,
          t: "أنا والبحر",
          co: "على شاطئ البحر ليلي معتاد
أنا وموج البحر ليلي معتاد
سألت الموج عن معناه فابتسم
وقال لي: أنا مثل الحب معتاد",
          ty: "فصيح",
          m: "الكامل",
          rl: "د",
          s: "published"
        },
        {
          id: 6,
          pid: 3,
          t: "نساء من نور",
          co: "نحن النساء اللاتي بنينا المجد
بحبر الدموع وألوان الأوجاع
نحن اللاتي نرقص على أنغام الحياة
ونغني للأمل في كل الأوقات",
          ty: "فصيح",
          m: "الخفيف",
          rl: "ت",
          s: "published"
        },
        {
          id: 7,
          pid: 4,
          t: "شباب اليوم",
          co: "جيل جديد يملأ الدنيا أملاً
وتطرب الأسماع لصداه الجميل
نبنى المستقبل بأيدينا اليوم
ونكتب التاريخ بأقلام الخول",
          ty: "شعبي",
          m: "المتقارب",
          rl: "ل",
          s: "published"
        },
        {
          id: 8,
          pid: 4,
          t: "رسالة أمل",
          co: "في كل قلب شظية من أمل
وبكل قلب شظية من ألم
نحن الشباب نريد أن نغير العالم
ونريد أن نكتب تاريخنا بالدم",
          ty: "شعبي",
          m: "الرجز",
          rl: "م",
          s: "pending"
        },
        {
          id: 9,
          pid: 5,
          t: "تاروت القديمة",
          co: "يا تاروت القديمة يا أم التاريخ
يا منزلي يا أحلى منزلي
شوارعك الفسيحة تروي ذكرياتنا
وأسوارك العالية تحكي مجدي",
          ty: "شعبي",
          m: "الهزج",
          rl: "ي",
          s: "published"
        },
        {
          id: 10,
          pid: 5,
          t: "ليلة صيد",
          co: "من قبيل الفجر نروح للصيد
ونركب المراكب على موج البحر

    // تسجيل الدخول
    function login() {
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      var alertDiv = document.getElementById('loginAlert');

      if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
        localStorage.setItem('isLoggedIn', 'true');
        alertDiv.textContent = L.loginSuccess;
        alertDiv.className = 'alert alert-success';

        setTimeout(function() {
          document.getElementById('loginModal').style.display = 'none';
          showPage('p-admin');
        }, 1000);
      } else {
        alertDiv.textContent = L.loginError;
        alertDiv.className = 'alert alert-error';
        alertDiv.style.display = 'block';
      }

    // تسجيل الخروج

      localStorage.setItem('isLoggedIn', 'false');

    // عرض الصفحة
    function showPage(p) {
      document.querySelectorAll('.page').forEach(function(e) {
        e.classList.remove('on');
      });
      document.getElementById(p).classList.add('on');

      document.querySelectorAll('.nv button').forEach(function(b) {
        b.classList.remove('on');
      });

      var m = {
        'p-home': 0,
        'p-search': 1,
        'p-admin': 2
      };

      if (m[p] !== undefined) {
        document.querySelectorAll('.nv button')[m[p]].classList.add('on');
      }

      window.scrollTo(0, 0);

      if (p === 'p-search') {
        doSearch();
      } else if (p === 'p-home') {
        renderPoets();
      } else if (p === 'p-admin') {
        showAdmin('poets');
      }
    }

    // عرض الشعراء
    function renderPoets(f) {
      var g = document.getElementById('pg');
      var h = '';
      var ps = D.poets;

      if (f) {
        f = f.toLowerCase();
        ps = ps.filter(function(p) {
          return p.n.toLowerCase().indexOf(f) > -1 || p.r.toLowerCase().indexOf(f) > -1 || p.c.toLowerCase().indexOf(f) > -1;
        });
      }

      ps.forEach(function(p) {
        var avatarContent = p.img ? '<img src="' + p.img + '" alt="' + p.n + '">' : p.n[0];
        h += '<div class="card" onclick="showPoet(' + p.id + ')"><div class="av">' + avatarContent + '</div><h3>' + p.n + '</h3><div class="rg">' + p.r + ' - ' + p.c + '</div><div class="ct"><span class="tag">' + p.pc + ' ' + L.poems + '</span> <span class="tag" style="background:rgba(201,168,76,.15);color:#c9a84c">' + p.y + '</span></div></div>';
      });

      g.innerHTML = h || '<p style="text-align:center;color:#b8a89a">' + L.noRes + '</p>';

      // تحديث الإحصائيات
      document.getElementById('poetCountDisplay').textContent = D.poets.length;
      document.getElementById('poemCountDisplay').textContent = D.poems.filter(p => p.s === 'published').length;

      var regions = {};
      D.poets.forEach(function(p) {
        regions[p.r] = (regions[p.r] || 0) + 1;
      });
      document.getElementById('regionCountDisplay').textContent = Object.keys(regions).length;
    }

    // عرض شاعر
    function showPoet(id) {
      var p = D.poets.find(function(x) {
        return x.id === id;
      });

      if (!p) return;

      showPage('p-poet');

      var pm = D.poems.filter(function(x) {
        return x.pid === id;
      });

      var avatarContent = p.img ? '<img src="' + p.img + '" alt="' + p.n + '">' : p.n[0];
      var h = '<div class="ph"><div class="av">' + avatarContent + '</div><h1>' + p.n + '</h1><div class="mt">' + p.r + ' - ' + p.c + ' | ' + p.co + ' | ' + p.y + '</div></div>';
      h += '<div class="bio">' + p.b + '</div>';
      h += '<h2 class="st">' + L.hisPoems + ' (' + pm.filter(function(x) {
        return x.s === "published";
      }).length + ')</h2>';

      pm.forEach(function(m) {
        if (m.s !== 'published') return;
        h += '<div class="pi"><div class="pih" onclick="toggleP(' + m.id + ')"><h3>' + m.t + '</h3><div class="bds"><span class="bd bd-t">' + m.ty + '</span><span class="bd bd-m">' + m.m + '</span><span class="bd bd-r">' + L.rhyme + ': ' + m.rl + '</span></div></div><div class="pic" id="pc-' + m.id + '">' + m.co.replace(/\n/g, '<br>') + '</div></div>';

      document.getElementById('pd').innerHTML = h;

    // عرض/إخفاء القصيدة

    // البحث
    function doSearch() {
      var q = document.getElementById('sq').value;
      var r = document.getElementById('fr').value;
      var t = document.getElementById('ft').value;
      var m = document.getElementById('fm').value;
      var rl = document.getElementById('frl').value;

      var res = D.poems.filter(function(p) {
        if (p.s !== 'published') return false;

        var poet = D.poets.find(function(x) {
          return x.id === p.pid;
        });

        if (q && p.t.toLowerCase().indexOf(q.toLowerCase()) === -1 && p.co.toLowerCase().indexOf(q.toLowerCase()) === -1 && poet.n.toLowerCase().indexOf(q.toLowerCase()) === -1) {
          return false;
        }

        if (r && poet.r !== r) return false;
        if (t && p.ty !== t) return false;
        if (m && p.m !== m) return false;
        if (rl && p.rl !== rl) return false;

        return true;
      });

      document.getElementById('src').textContent = L.found + ' ' + res.length + ' ' + L.result;

      var h = '';
      res.forEach(function(p) {
        var poet = D.poets.find(function(x) {
          return x.id === p.pid;
        });
        h += '<div class="pc" onclick="showPoet(' + p.pid + ')"><h3>' + p.t + '</h3><div class="pn">' + poet.n + ' - ' + poet.r + '</div><div class="bds" style="margin-top:6px"><span class="bd bd-t">' + p.ty + '</span><span class="bd bd-m">' + p.m + '</span></div><div class="pv">' + p.co.split('\n')[0] + '</div></div>';
      });

      document.getElementById('sr').innerHTML = h;
    }

          pnd.forEach(function(p) {

        }
      } else if (s === 'stats') {
        h = '<div class="grid">';

        // حسب المنطقة
        var regions = {};
        D.poets.forEach(function(p) {
          regions[p.r] = (regions[p.r] || 0) + 1;

        h += '<div class="pc"><h3>' + L.byRegion + '</h3>';

          types[p.ty] = (types[p.ty] || 0) + 1;

        h += '<div class="pc"><h3>' + L.byType + '</h3>';
        for (var k in types) {
          h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)"><span>' + k + '</span><span style="color:#c9a84c;font-weight:700">' + types[k] + '</span></div>';

        h += '</div>';

        var meters = {};
        D.poems.filter(function(p) {
          return p.s === 'published';

          meters[p.m] = (meters[p.m] || 0) + 1;

          h += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)"><span>' + k + '</span><span style="color:#c9a84c;font-weight:700">' + meters[k] + '</span></div>';

        h += '</div></div>';

      document.getElementById('ac').innerHTML = h;

    // إضافة شاعر
    function addPoet() {
      var name = document.getElementById('newPoetName').value;
      var img = document.getElementById('newPoetImage').value;
      var bio = document.getElementById('newPoetBio').value;
      var region = document.getElementById('newPoetRegion').value;
      var city = document.getElementById('newPoetCity').value;
      var country = document.getElementById('newPoetCountry').value;
      var year = document.getElementById('newPoetYear').value;

      if (!name || !bio || !region || !city || !year) {
        alert('يرجى تعبئة جميع الحقول');
        return;
      }

      var newId = D.poets.length > 0 ? Math.max(...D.poets.map(p => p.id)) + 1 : 1;

      D.poets.push({
        id: newId,
        n: name,
        img: img,
        b: bio,
        r: region,
        c: city,
        co: country,
        y: parseInt(year),
        pc: 0
      });

      saveData();
      showAdmin('poets');
      alert(L.poetAdded);
    }

    function updatePoet() {
      var id = parseInt(document.getElementById('editPoetId').value);
      var name = document.getElementById('editPoetName').value;
      var img = document.getElementById('editPoetImage').value;
      var bio = document.getElementById('editPoetBio').value;
      var region = document.getElementById('editPoetRegion').value;
      var city = document.getElementById('editPoetCity').value;
      var country = document.getElementById('editPoetCountry').value;
      var year = document.getElementById('editPoetYear').value;

      if (!name || !bio || !region || !city || !year) {
        alert('يرجى تعبئة جميع الحقول');
        return;
      }

      D.poets.forEach(function(p) {
        if (p.id === id) {
          p.n = name;
          p.img = img;
          p.b = bio;
          p.r = region;
          p.c = city;
          p.co = country;
          p.y = parseInt(year);
        }
      });

      saveData();
      showAdmin('poets');
      alert(L.poetUpdated);
    }

    // حذف شاعر
    function deletePoet(id) {
      if (confirm(L.confirmDelete)) {
        D.poets = D.poets.filter(function(p) {
          return p.id !== id;
        });

        // حذف قصائد الشاعر
        D.poems = D.poems.filter(function(p) {
          return p.pid !== id;
        });

        saveData();
        showAdmin('poets');
        alert(L.poetDeleted);
      }
    }

    // عرض نموذج إضافة قصيدة
    function showAddPoemForm() {
      var h = '<div class="pnd"><h3>' + L.addPoem + '</h3>';
      h += '<form id="addPoemForm">';
      h += '<div class="mb-3"><label class="form-label">' + L.poet + '</label><select class="form-select" id="newPoemPoet">';
      D.poets.forEach(function(p) {
        h += '<option value="' + p.id + '">' + p.n + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemTitle + '</label><input type="text" class="form-control" id="newPoemTitle" required></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemContent + '</label><textarea class="form-control" id="newPoemContent" rows="5" required></textarea></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemType + '</label><select class="form-select" id="newPoemType">';
      F.t.forEach(function(t) {
        h += '<option value="' + t + '">' + t + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemMeter + '</label><select class="form-select" id="newPoemMeter">';
      F.m.forEach(function(m) {
        h += '<option value="' + m + '">' + m + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemRhyme + '</label><select class="form-select" id="newPoemRhyme">';
      F.rl.forEach(function(rl) {
        h += '<option value="' + rl + '">' + rl + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemStatus + '</label><select class="form-select" id="newPoemStatus"><option value="published">' + L.published + '</option><option value="pending">' + L.pending + '</option></select></div>';
      h += '<div class="acts"><button type="button" class="btn bg" onclick="addPoem()">' + L.save + '</button><button type="button" class="btn br" onclick="showAdmin(\"poems\")">' + L.cancel + '</button></div>';
      h += '</form></div>';

      document.getElementById('ac').innerHTML = h;
    }

    // إضافة قصيدة
    function addPoem() {
      var poetId = parseInt(document.getElementById('newPoemPoet').value);
      var title = document.getElementById('newPoemTitle').value;
      var content = document.getElementById('newPoemContent').value;
      var type = document.getElementById('newPoemType').value;
      var meter = document.getElementById('newPoemMeter').value;
      var rhyme = document.getElementById('newPoemRhyme').value;
      var status = document.getElementById('newPoemStatus').value;

      if (!poetId || !title || !content || !type || !meter || !rhyme) {
        alert('يرجى تعبئة جميع الحقول');
        return;
      }

      var newId = D.poems.length > 0 ? Math.max(...D.poems.map(p => p.id)) + 1 : 1;

      D.poems.push({
        id: newId,
        pid: poetId,
        t: title,
        co: content,
        ty: type,
        m: meter,
        rl: rhyme,
        s: status
      });

      // تحديث عدد قصائد الشاعر
      D.poets.forEach(function(p) {
        if (p.id === poetId) {
          p.pc = D.poems.filter(poem => poem.pid === poetId).length;
        }
      });

      saveData();
      showAdmin('poems');
      alert(L.poemAdded);
    }

    // عرض نموذج تعديل قصيدة
    function showEditPoemForm(id) {
      var poem = D.poems.find(function(p) {
        return p.id === id;
      });

      if (!poem) return;

      var h = '<div class="pnd"><h3>' + L.editPoem + '</h3>';
      h += '<form id="editPoemForm">';
      h += '<input type="hidden" id="editPoemId" value="' + poem.id + '">';
      h += '<div class="mb-3"><label class="form-label">' + L.poet + '</label><select class="form-select" id="editPoemPoet">';
      D.poets.forEach(function(p) {
        h += '<option value="' + p.id + '"' + (p.id === poem.pid ? ' selected' : '') + '>' + p.n + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemTitle + '</label><input type="text" class="form-control" id="editPoemTitle" value="' + poem.t + '" required></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemContent + '</label><textarea class="form-control" id="editPoemContent" rows="5" required>' + poem.co + '</textarea></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemType + '</label><select class="form-select" id="editPoemType">';
      F.t.forEach(function(t) {
        h += '<option value="' + t + '"' + (t === poem.ty ? ' selected' : '') + '>' + t + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemMeter + '</label><select class="form-select" id="editPoemMeter">';
      F.m.forEach(function(m) {
        h += '<option value="' + m + '"' + (m === poem.m ? ' selected' : '') + '>' + m + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemRhyme + '</label><select class="form-select" id="editPoemRhyme">';
      F.rl.forEach(function(rl) {
        h += '<option value="' + rl + '"' + (rl === poem.rl ? ' selected' : '') + '>' + rl + '</option>';
      });
      h += '</select></div>';
      h += '<div class="mb-3"><label class="form-label">' + L.newPoemStatus + '</label><select class="form-select" id="editPoemStatus"><option value="published"' + (poem.s === 'published' ? ' selected' : '') + '>' + L.published + '</option><option value="pending"' + (poem.s === 'pending' ? ' selected' : '') + '>' + L.pending + '</option><option value="rejected"' + (poem.s === 'rejected' ? ' selected' : '') + '>' + L.rejected + '</option></select></div>';
      h += '<div class="acts"><button type="button" class="btn bg" onclick="updatePoem()">' + L.save + '</button><button type="button" class="btn br" onclick="showAdmin(\"poems\")">' + L.cancel + '</button></div>';
      h += '</form></div>';

      document.getElementById('ac').innerHTML = h;
    }

    // تحديث قصيدة
    function updatePoem() {
      var id = parseInt(document.getElementById('editPoemId').value);
      var poetId = parseInt(document.getElementById('editPoemPoet').value);
      var title = document.getElementById('editPoemTitle').value;
      var content = document.getElementById('editPoemContent').value;
      var type = document.getElementById('editPoemType').value;
      var meter = document.getElementById('editPoemMeter').value;
      var rhyme = document.getElementById('editPoemRhyme').value;
      var status = document.getElementById('editPoemStatus').value;

      if (!poetId || !title || !content || !type || !meter || !rhyme) {
        alert('يرجى تعبئة جميع الحقول');
        return;
      }

      var oldPoetId = D.poems.find(p => p.id === id).pid;

      D.poems.forEach(function(p) {
        if (p.id === id) {
          p.pid = poetId;
          p.t = title;
          p.co = content;
          p.ty = type;
          p.m = meter;
          p.rl = rhyme;
          p.s = status;
        }
      });

      // تحديث عدد قصائد الشعراء
      D.poets.forEach(function(p) {
        p.pc = D.poems.filter(poem => poem.pid === p.id).length;
      });

      saveData();
      showAdmin('poems');
      alert(L.poemUpdated);
    }

    // حذف قصيدة
    function deletePoem(id) {
      if (confirm(L.confirmDelete)) {
        var poetId = D.poems.find(p => p.id === id).pid;

        D.poems = D.poems.filter(function(p) {
          return p.id !== id;
        });

        // تحديث عدد قصائد الشاعر
        D.poets.forEach(function(p) {
          if (p.id === poetId) {
            p.pc = D.poems.filter(poem => poem.pid === poetId).length;
          }
        });

        saveData();
        showAdmin('poems');
        alert(L.poemDeleted);
      }
    }

      // أزرار لوحة التحكم
      var an = document.getElementById('adminNav');
